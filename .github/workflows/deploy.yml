name: Deploy - raj_development

on:
  push:
    branches:
      - raj_development

jobs:
  deploy:
    name: Pull & Deploy on Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: raj_development

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
             sudo -u rentnking bash -c '
                cd ${{ secrets.PROJECT_PATH }} &&
                git pull origin raj_development &&
                /opt/cpanel/ea-php83/root/usr/bin/php /usr/local/cpanel/3rdparty/wp-toolkit/plib/vendor/wp-cli/vendor/bin/composer install &&
                /opt/cpanel/ea-php83/root/usr/bin/php artisan migrate --force &&
                /opt/cpanel/ea-php83/root/usr/bin/php artisan config:cache &&
                /opt/cpanel/ea-php83/root/usr/bin/php artisan route:cache &&
                /opt/cpanel/ea-php83/root/usr/bin/php artisan view:cache &&
                /opt/cpanel/ea-php83/root/usr/bin/php artisan queue:restart &&
                /opt/cpanel/ea-php83/root/usr/bin/php artisan scribe:generate
              '
